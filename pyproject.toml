[project]
name = ""
version = "1.1.0"
requires-python = ">=3.13"
dependencies = [
    "lxml>=4.6.1",
    "pygame-ce>=2.0.0",
    "pygame-popup==0.11.2",
    "pytest>=9.0.0",
    "pytmx>=3.31",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "tensorboard>=2.20.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (replaces flake8)
# C90: mccabe complexity (replaces flake8-mccabe)
# I: isort-style import sorting
# PL: pylint (replaces pylint)
select = ["E", "F", "C90", "I", "PL"]
# Ignore rules that are overly strict or conflict with the project style
ignore = [
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value comparison
    "F403",     # Star imports
    "F405",     # May be undefined from star import
]

[tool.ruff.lint.mccabe]
max-complexity = 10
